<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carte de profil</title>
    <link rel="stylesheet" href="profil.css">
  </head>
  <body>
    <main id="profile-card" class="card" data-user-id="2026">
      <div class="profile-image" title="Photo de profil">DM</div>

      <section class="profile-info">
        <h2>Diaby Mohamed</h2>
        <p class="subtitle">Étudiant en informatique</p>
        <p class="bio">
          Je travaille mes bases en développement web, langage C et logique de programmation.
          Cette carte sert à pratiquer HTML, CSS et les attributs globaux.
        </p>
      </section>

      <section class="skills">
        <h3>Compétences</h3>
        <ul>
          <li class="skill-item advanced">HTML</li>
          <li class="skill-item advanced">CSS</li>
          <li class="skill-item advanced">C</li>
          <li class="skill-item">Git</li>
          <li class="skill-item">Linux</li>
        </ul>
      </section>

      <blockquote lang="en">
        Practice makes progress.
      </blockquote>
    </main>
  </body>
</html>
