<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvel utilisateur</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 60px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            color: #222;
            text-align: center;
        }

        p {
            color: #666;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            margin-top: 10px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .link {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">

            <h1>Créer un utilisateur</h1>

            <p>Ajoutez un nouvel utilisateur avec un badge unique.</p>

            <form action="/form" method="post">

                <label>Nom</label>
                <input type="text" name="nom" placeholder="Nom" required>

                <label>Prénom</label>
                <input type="text" name="prenom" placeholder="Prénom" required>

                <label>Numéro de badge</label>
                <input type="text" name="numero_badge" placeholder="Badge" required>

                <button type="submit">
                    Créer l'utilisateur
                </button>

            </form>

            <a class="link" href="/utilisateurs">
                Voir les utilisateurs
            </a>

        </div>
    </div>

</body>

</html>
