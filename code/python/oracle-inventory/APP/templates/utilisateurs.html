<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilisateurs</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f7fb;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .user-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.08);
        }

        .user-card h2 {
            margin-top: 0;
            color: #2563eb;
        }

        .user-card p {
            margin: 8px 0;
            color: #444;
        }

        .badge {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 14px;
            margin-top: 10px;
        }

        .top-link {
            display: block;
            width: fit-content;
            margin: 0 auto 30px auto;
            text-decoration: none;
            background-color: #2563eb;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
        }

        .top-link:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <h1>Liste des utilisateurs</h1>

    <a class="top-link" href="/nouvel_utilisateur">
        Ajouter un utilisateur
    </a>

    <div class="container">

        {% for utilisateur in utilisateurs %}

        <div class="user-card">

            <h2>
                {{ utilisateur.nom }} {{ utilisateur.prenom }}
            </h2>

            <p>
                <strong>Nom :</strong>
                {{ utilisateur.nom }}
            </p>

            <p>
                <strong>Prénom :</strong>
                {{ utilisateur.prenom }}
            </p>

            <div class="badge">
                Badge : {{ utilisateur.numero_badge }}
            </div>

        </div>

        {% endfor %}

    </div>

</body>

</html>
